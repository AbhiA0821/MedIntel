<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDINTEL — Critical Alerts Feed</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Navbar Header -->
    <header class="navbar">
      <div class="brand">
        <div class="brand-icon-svg">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
        </div>
        <div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="brand-title">MEDINTEL</span>
            <span class="badge-severity CRITICAL font-mono" style="font-size:10px; padding:2px 6px;">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
              EMERGENCY
            </span>
          </div>
          <div class="brand-sub">Critical Telemetry &amp; Alert Feed</div>
        </div>
      </div>

      <div class="header-center">
        <div>
          <h1>Active Critical Alerts Feed</h1>
          <p>Real-time inpatient alerts requiring immediate clinical attention</p>
        </div>
      </div>

      <div class="header-right">
        <!-- Theme Toggle -->
        <button type="button" class="btn-icon-toggle" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle light/dark theme" title="Switch Theme">
          <svg id="themeIconSun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg id="themeIconMoon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>

        <!-- Live Clock -->
        <div class="header-clock font-mono">
          <span id="liveClock">--:--:--</span>
        </div>

        <a href="{{ url_for('doctor_dashboard') }}" class="btn-db" style="text-decoration:none; margin:0; font-size:11.5px; font-weight:600; display:flex; align-items:center; gap:6px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          Back to Dashboard
        </a>
      </div>
    </header>

    <!-- Main Shell -->
    <main class="content-area" style="padding: 16px 20px; overflow-y: auto;">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:12px; margin-bottom:16px;">
        <div style="display:flex; align-items:center; gap:10px;">
          <h2 style="font-size:15px; font-weight:800; color:var(--text); margin:0;">Active Critical Alerts</h2>
          <span id="criticalPageCount" class="count-pill critical font-mono" style="font-size:12px;">0</span>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <button type="button" class="btn-db" onclick="loadCriticalAlerts()" style="display:flex; align-items:center; gap:6px; font-size:11px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
            Refresh Feed
          </button>
          <span id="criticalPageBadge" class="badge-severity CRITICAL font-mono" style="font-size:11px; padding: 4px 10px;">0 PATIENTS AT RISK</span>
        </div>
      </div>

      <!-- Dynamic Grid Rendering ALL Active Critical Alerts -->
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 14px;" id="alertsGrid">
        <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted);">
          <div class="skeleton-line" style="width: 50%; margin: 8px auto;"></div>
          <div class="skeleton-line" style="width: 30%; margin: 8px auto;"></div>
          Loading active critical alerts...
        </div>
      </div>
    </main>

    <footer class="app-footer">
      MEDINTEL · v2.0.0
    </footer>
  </div>

  <script>
    // Theme Management
    (function initTheme() {
      const saved = localStorage.getItem('medintel_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
      updateThemeIcons(saved);
    })();

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = current === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('medintel_theme', next);
      updateThemeIcons(next);
    }

    function updateThemeIcons(theme) {
      const sun = document.getElementById('themeIconSun');
      const moon = document.getElementById('themeIconMoon');
      if (sun && moon) {
        if (theme === 'light') {
          sun.style.display = 'none';
          moon.style.display = 'block';
        } else {
          sun.style.display = 'block';
          moon.style.display = 'none';
        }
      }
    }

    // Live Clock
    setInterval(() => {
      const el = document.getElementById('liveClock');
      if (el) el.textContent = new Date().toLocaleTimeString();
    }, 1000);

    document.addEventListener('DOMContentLoaded', loadCriticalAlerts);

    async function loadCriticalAlerts() {
      const grid = document.getElementById('alertsGrid');
      const countEl = document.getElementById('criticalPageCount');
      const badgeEl = document.getElementById('criticalPageBadge');

      try {
        const res = await fetch('/api/v1/live_vitals');
        if (!res.ok) throw new Error('API request failed');
        const data = await res.json();
        const criticals = (data.patients || []).filter(p => p.severity === 'CRITICAL');

        if (countEl) countEl.textContent = criticals.length;
        if (badgeEl) badgeEl.textContent = `${criticals.length} PATIENT${criticals.length === 1 ? '' : 'S'} AT RISK`;

        if (criticals.length === 0) {
          grid.innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1; padding: 48px 16px;">
              <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="var(--low)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
              </svg>
              <div class="empty-state-title" style="color: var(--low);">No Active Critical Alerts</div>
              <div class="empty-state-sub">All monitored patient vitals are currently within stable baseline thresholds.</div>
            </div>
          `;
          return;
        }

        grid.innerHTML = criticals.map(p => {
          const reasonItems = p.reasons && p.reasons.length > 0 
            ? p.reasons.map(r => `<li><span class="bullet-dot">•</span> ${escapeHtml(r)}</li>`).join('')
            : `<li><span class="bullet-dot">•</span> Hypoxia / Pyrexia</li>`;

          return `
            <div class="critical-card" style="padding: 14px; margin-bottom: 0;">
              <div class="critical-header">
                <div>
                  <span class="status-dot red"></span>
                  <strong class="font-mono" style="color: var(--accent); font-size: 13px;">${p.patient_id}</strong>
                  <span style="font-weight:700; color:var(--text); font-size: 13px; margin-left: 6px;">${escapeHtml(p.name)}</span>
                </div>
                <span class="font-mono" style="font-size:10px; color: var(--text-faint);">${p.last_update || 'Just now'}</span>
              </div>
              <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">${escapeHtml(p.ward || 'General')} • Room ${p.room_no || '201'} • Bed ${p.bed_no || '1'}</div>
              
              <div class="critical-vitals font-mono" style="font-size: 11px; padding: 6px 10px; margin-top: 6px;">
                <span class="${p.spo2 < 90 ? 'val-danger' : ''}">SpO₂: ${p.spo2}%</span> •
                <span class="${p.temperature > 38.5 ? 'val-danger' : ''}">Temp: ${p.temperature}°C</span> •
                <span class="${p.heart_rate > 120 || p.heart_rate < 50 ? 'val-danger' : ''}">HR: ${p.heart_rate} bpm</span> •
                <span>BP: ${p.systolic_bp}/${p.diastolic_bp}</span>
              </div>

              <div class="reason-box" style="margin-top: 8px;">
                <div class="reason-title">CLINICAL INDICATION</div>
                <ul class="reason-bullets">
                  ${reasonItems}
                </ul>
              </div>

              <div class="critical-rec-box" style="margin-top: 8px;">
                <span style="font-weight:700;">AI Recommendation:</span> ${escapeHtml(p.recommendation || 'Initiate oxygen therapy & urgent clinical consult.')}
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error('Error loading critical alerts:', err);
        grid.innerHTML = `
          <div class="error-state" style="grid-column: 1 / -1; padding: 40px 16px;">
            <div style="color: var(--critical); font-weight: 700; margin-bottom: 6px;">Connection Delayed</div>
            <div style="color: var(--text-muted); font-size: 11.5px; margin-bottom: 12px;">Unable to fetch real-time telemetry from FastAPI backend.</div>
            <button type="button" class="btn-db primary" onclick="loadCriticalAlerts()">Retry Connection</button>
          </div>
        `;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
